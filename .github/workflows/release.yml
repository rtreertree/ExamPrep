name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a migration or leave a test branch behind on a newer push.
concurrency:
  group: exam-prep-production
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  acceptance:
    name: Neon acceptance on Node and Workers
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: integration
    env:
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      NEON_PARENT_BRANCH_ID: ${{ vars.NEON_PARENT_BRANCH_ID }}
      NEON_DATABASE_NAME: ${{ vars.NEON_DATABASE_NAME }}
      NEON_ROLE_NAME: ${{ vars.NEON_ROLE_NAME }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.14.0
          package-manager-cache: false
      - name: Create disposable test branch and fresh authentication secrets
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: node scripts/neon-ci.mjs create
      - run: npm ci
      - run: npm run build
      - run: npm exec -- playwright install --with-deps chromium
      - name: Apply migrations to disposable database only
        run: npm run db:migrate
      - name: Exercise both runtimes with API and Chromium acceptance
        run: npm run test:acceptance
      - name: Delete disposable branch even after a failed test
        if: always()
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: node scripts/neon-ci.mjs cleanup

  production:
    name: Migrate, deploy and smoke test production
    needs: [checks, acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://exam.phonet.app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.14.0
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npm run worker:check
      - name: Apply production migrations, verify readiness, deploy code and secrets together
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          PASSWORD_PEPPER: ${{ secrets.PASSWORD_PEPPER }}
          BETTER_AUTH_URL: https://exam.phonet.app
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:production
      - name: Check public frontend, routing, cache policy and safe API
        run: npm run smoke -- https://exam.phonet.app
      - name: Publish deployment result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          printf '### Production deployment: %s\n\nCommit: `%s`\n\n[Exam Prep](https://exam.phonet.app)\n\nSee the migration, deploy and smoke steps for failures.\n' "$JOB_STATUS" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
