name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel an active production migration on a newer push.
concurrency:
  group: exam-prep-production
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  production:
    name: Migrate, deploy and smoke test production
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://exam.phonet.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.14.0
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npm run worker:check
      - name: Apply production migrations, verify readiness, deploy code and secrets together
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          PASSWORD_PEPPER: ${{ secrets.PASSWORD_PEPPER }}
          BETTER_AUTH_URL: https://exam.phonet.app
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:production
      - name: Check public frontend, routing, cache policy and safe API
        run: npm run smoke -- https://exam.phonet.app
      - name: Publish deployment result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          printf '### Production deployment: %s\n\nCommit: `%s`\n\n[Exam Prep](https://exam.phonet.app)\n\nSee the migration, deploy and smoke steps for failures.\n' "$JOB_STATUS" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
