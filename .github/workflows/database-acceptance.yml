name: Database acceptance

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      artifact_id:
        type: string
        required: true
      use_release_package:
        type: boolean
        default: true
    secrets:
      TEST_DATABASE_URL:
        required: true
      TEST_DATABASE_URL_UNPOOLED:
        required: true

permissions:
  contents: read

jobs:
  acceptance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: database-acceptance
    concurrency:
      group: exam-prep-database-acceptance
      queue: max
      cancel-in-progress: false
    steps:
      - name: Verify the test database secrets are available
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          TEST_DATABASE_URL_UNPOOLED: ${{ secrets.TEST_DATABASE_URL_UNPOOLED }}
        run: |
          for name in TEST_DATABASE_URL TEST_DATABASE_URL_UNPOOLED; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Set the $name secret in the database-acceptance environment."
              exit 1
            fi
          done
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.14.0
          package-manager-cache: false
      - run: npm ci
      - name: Require the CI artifact ID
        if: inputs.use_release_package
        env:
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          if [[ ! "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Database acceptance requires the CI release artifact ID."
            exit 1
          fi
      - name: Download the verified release package
        if: inputs.use_release_package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-package
      - name: Extract the release package
        if: inputs.use_release_package
        run: tar -xzf "$RUNNER_TEMP/release-package/release.tar.gz"
      - name: Build the package for standalone acceptance
        if: ${{ !inputs.use_release_package }}
        run: |
          npm run build
          npm run worker:package
      - run: npm exec -- playwright install --with-deps chromium
      - name: Verify and migrate the test database, then run Node and Worker acceptance
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          TEST_DATABASE_URL_UNPOOLED: ${{ secrets.TEST_DATABASE_URL_UNPOOLED }}
        run: npm run test:acceptance -- --production-package --shared-test-database
        timeout-minutes: 35
