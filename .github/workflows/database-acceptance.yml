name: Database acceptance

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      artifact_id:
        type: string
        required: true
      use_release_package:
        type: boolean
        default: true
    secrets:
      NEON_TEST_API_KEY:
        required: true

permissions:
  contents: read

jobs:
  acceptance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: database-acceptance
    env:
      NEON_TEST_PROJECT_ID: ${{ vars.NEON_TEST_PROJECT_ID }}
      NEON_TEST_PARENT_ID: ${{ vars.NEON_TEST_PARENT_ID }}
      NEON_TEST_DATABASE: ${{ vars.NEON_TEST_DATABASE }}
      NEON_TEST_OWNER: ${{ vars.NEON_TEST_OWNER }}
    steps:
      - name: Verify the Neon environment secret is available
        env:
          NEON_TEST_API_KEY: ${{ secrets.NEON_TEST_API_KEY }}
        run: |
          if [[ -z "$NEON_TEST_API_KEY" ]]; then
            echo "::error::Set the NEON_TEST_API_KEY secret in the database-acceptance environment."
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.14.0
          package-manager-cache: false
      - run: npm ci
      - name: Require the CI artifact ID
        if: inputs.use_release_package
        env:
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          if [[ ! "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Database acceptance requires the CI release artifact ID."
            exit 1
          fi
      - name: Download the verified release package
        if: inputs.use_release_package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-package
      - name: Extract the release package
        if: inputs.use_release_package
        run: tar -xzf "$RUNNER_TEMP/release-package/release.tar.gz"
      - name: Build the package for standalone acceptance
        if: ${{ !inputs.use_release_package }}
        run: |
          npm run build
          npm run worker:package
      - run: npm exec -- playwright install --with-deps chromium
      - name: Provision and verify a disposable test branch
        id: provision
        env:
          NEON_TEST_API_KEY: ${{ secrets.NEON_TEST_API_KEY }}
        run: node --import tsx scripts/neon-test-branch.ts prepare
      - name: Run Node and Worker acceptance
        run: npm run test:acceptance -- --production-package
        timeout-minutes: 30
      - name: Delete this run's disposable branch
        if: ${{ always() && contains(fromJSON('["success", "failure", "cancelled"]'), steps.provision.outcome) }}
        env:
          NEON_TEST_API_KEY: ${{ secrets.NEON_TEST_API_KEY }}
        run: node --import tsx scripts/neon-test-branch.ts cleanup
